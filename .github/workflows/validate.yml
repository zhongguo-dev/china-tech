name: Validate public repository

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate documentation and taxonomy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate
        run: |
          node scripts/validate.mjs
          node scripts/generate-catalog.mjs --check
          node scripts/generate-radar.mjs --check
